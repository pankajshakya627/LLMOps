name: Application checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAGAS_DO_NOT_TRACK: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.5'
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked --extra aws --extra ui --extra evaluation
      - run: uv run --no-sync ruff check app tests infra/aws
      - run: uv run --no-sync mypy --explicit-package-bases app infra/aws/lab.py tests/test_aws_lab.py
      - run: uv run --no-sync pytest -q tests
      - name: Validate CloudFormation and shell
        run: |
          uvx --from 'cfn-lint==1.46.0' cfn-lint infra/aws/session.yaml infra/aws/github-oidc.yaml infra/aws/datadog-forwarder.yaml
          bash -n infra/aws/host.sh
      - name: Validate AWS Compose without credentials or live AWS calls
        env:
          APP_IMAGE: example/app@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          GATEWAY_IMAGE: example/gateway@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          GUARDRAILS_IMAGE: example/guardrails@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          POSTGRES_PASSWORD: offline
          LITELLM_MASTER_KEY: sk-offline
          AWS_REGION: ap-south-1
          OPENAI_API_KEY: sk-offline
          DD_API_KEY: '00000000000000000000000000000000'
          DD_TAGS: session:nexa-lab-offline,lab_session_id:offline
          BEDROCK_CHAT_ROUTE: bedrock/converse/offline
          BEDROCK_JUDGE_ROUTE: bedrock/converse/offline
          BEDROCK_GUARDRAIL_ID: offline
          BEDROCK_GUARDRAIL_VERSION: '1'
        run: |
          touch app/.env
          docker compose -f app/compose.aws.yaml config --quiet
          docker compose -f app/compose.aws.yaml -f app/compose.aws.bedrock.yaml config --quiet
          rm app/.env
