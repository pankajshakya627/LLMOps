name: Application checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      release_images:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAGAS_DO_NOT_TRACK: 'true'
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tokenizers
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.5'
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked --extra aws --extra ui --extra evaluation
      - name: Prime the checksum-verified tokenizer used on API startup
        run: uv run --no-sync python -c "import tiktoken; tiktoken.get_encoding('o200k_base')"
      - run: uv run --no-sync ruff check app tests infra/aws
      - run: uv run --no-sync mypy --explicit-package-bases app infra/aws/lab.py tests/test_aws_lab.py
      - run: uv run --no-sync pytest -q tests
      - run: uv run --no-sync pytest -q tests/runtime/ragas_adapters_check.py
      - name: Validate CloudFormation and shell
        run: |
          uvx --from 'cfn-lint==1.46.0' cfn-lint infra/aws/session.yaml infra/aws/github-oidc.yaml infra/aws/datadog-forwarder.yaml
          bash -n infra/aws/host.sh
      - name: Validate AWS Compose without credentials or live AWS calls
        env:
          APP_IMAGE: example/app@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          GATEWAY_IMAGE: example/gateway@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          GUARDRAILS_IMAGE: example/guardrails@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          POSTGRES_PASSWORD: offline
          FEEDBACK_REVIEWER_TOKEN: offline
          LITELLM_MASTER_KEY: sk-offline
          AWS_REGION: ap-south-1
          OPENAI_API_KEY: sk-offline
          DD_API_KEY: '00000000000000000000000000000000'
          DD_TAGS: session:nexa-lab-offline,lab_session_id:offline
          BEDROCK_CHAT_ROUTE: bedrock/converse/offline
          BEDROCK_JUDGE_ROUTE: bedrock/converse/offline
          BEDROCK_GUARDRAIL_ID: offline
          BEDROCK_GUARDRAIL_VERSION: '1'
        run: |
          docker compose -f app/compose.aws.yaml config --quiet
          docker compose -f app/compose.aws.yaml -f app/compose.aws.bedrock.yaml config --quiet
          unset DD_API_KEY
          docker compose -f app/compose.aws.yaml -f app/compose.aws.cloudwatch.yaml config --quiet
          unset OPENAI_API_KEY
          docker compose -f app/compose.aws.yaml -f app/compose.aws.bedrock.yaml -f app/compose.aws.cloudwatch.yaml config --quiet
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {component: app, dockerfile: app/Dockerfile}
          - {component: gateway, dockerfile: app/gateway/Dockerfile}
          - {component: guardrails, dockerfile: app/security/Dockerfile}
    env:
      IMAGE: nexa-ci/${{ matrix.component }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build release image
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: docker buildx build --platform linux/amd64 --load --provenance=false -f "$DOCKERFILE" -t "$IMAGE" .
      - name: Smoke-test image without external network access
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          case "$COMPONENT" in
            app) docker run --rm --network none -e INSTITUTION=test -e JURISDICTION=IN -e CONFIDENTIALITY_LEVEL=internal -e MONGODB_URI=mongodb://offline -e MONGODB_DB=test -e MONGODB_COLLECTION=chunks "$IMAGE" python -c "from fastapi.testclient import TestClient; from app.main import app; client=TestClient(app); client.__enter__(); assert client.get('/health').status_code == 200; client.__exit__(None,None,None)" ;;
            gateway) docker run --rm --network none -v "$PWD:/src:ro" -w /src -e PYTHONPATH=/src "$IMAGE" python tests/runtime/aws_gateway_check.py ;;
            guardrails) docker run --rm --network none "$IMAGE" python -m app.security.guardrails_service --self-check ;;
          esac
      - name: Export the tested image
        if: inputs.release_images
        run: docker save "$IMAGE" | zstd -T0 -3 -o "$RUNNER_TEMP/${{ matrix.component }}.tar.zst"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.release_images
        with:
          name: release-${{ matrix.component }}
          path: ${{ runner.temp }}/${{ matrix.component }}.tar.zst
          retention-days: 1
          compression-level: 0
  required:
    name: Application CI
    runs-on: ubuntu-latest
    needs: [check, images]
    if: always()
    steps:
      - run: test "${{ needs.check.result }}" = success && test "${{ needs.images.result }}" = success
