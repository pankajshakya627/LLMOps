name: nexaassist-aws

# UI access is restricted by the session security group; backend ports use SSM forwarding.
services:
  postgres:
    labels:
      com.datadoghq.ad.logs: '[{"source":"postgresql","service":"nexaassist-postgres"}]'
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_DB: nexaassist
      POSTGRES_USER: nexaassist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexaassist -d nexaassist"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  gateway:
    labels:
      com.datadoghq.ad.logs: '[{"source":"python","service":"nexaassist-gateway"}]'
    image: ${GATEWAY_IMAGE:?required}
    command: ["litellm", "--config", "/opt/gateway/litellm_openai.yaml", "--host", "0.0.0.0", "--port", "4000", "--num_workers", "1"]
    environment:
      DD_API_KEY: ${DD_API_KEY:?Set DD_API_KEY in .env}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_ENV: ${DD_ENV:-dev}
      DD_SERVICE: nexaassist-gateway
      DD_LLMOBS_ENABLED: ${DD_LLMOBS_ENABLED:-true}
      DD_LLMOBS_ML_APP: ${DD_LLMOBS_ML_APP:-nexaassist}
      DD_LLMOBS_AGENTLESS_ENABLED: "true"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_LITELLM_CHAT_MODEL: ${OPENAI_LITELLM_CHAT_MODEL:-openai/gpt-6-luna}
      OPENAI_LITELLM_JUDGE_MODEL: ${OPENAI_LITELLM_JUDGE_MODEL:-openai/gpt-6-luna}
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
  guardrails:
    labels:
      com.datadoghq.ad.logs: '[{"source":"python","service":"nexaassist-guardrails"}]'
    image: ${GUARDRAILS_IMAGE:?required}
    restart: unless-stopped
  api:
    labels:
      com.datadoghq.ad.logs: '[{"source":"python","service":"nexaassist-api"}]'
    image: ${APP_IMAGE:?required}
    env_file: .env
    environment:
      DD_API_KEY: ${DD_API_KEY:?Set DD_API_KEY in .env}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_ENV: ${DD_ENV:-dev}
      DD_SERVICE: nexaassist-api
      DD_LLMOBS_ENABLED: ${DD_LLMOBS_ENABLED:-true}
      DD_LLMOBS_ML_APP: ${DD_LLMOBS_ML_APP:-nexaassist}
      DD_LLMOBS_AGENTLESS_ENABLED: "true"
      DD_TRACE_ENABLED: "false"
      DD_METRICS_ENABLED: "true"
      DD_CAPTURE_CONTENT: ${DD_CAPTURE_CONTENT:-false}
      STORAGE_BACKEND: pgvector
      POSTGRES_DSN: postgresql://nexaassist:${POSTGRES_PASSWORD:?required}@postgres:5432/nexaassist
      INSTITUTION: NexaBank
      JURISDICTION: IN
      CONFIDENTIALITY_LEVEL: internal
      OPENAI_API_KEY: ""
      CHAT_MODEL: nexa-chat-openai
      CHAT_API_MODE: chat_completions
      CHAT_BASE_URL: http://gateway:4000/v1
      CHAT_API_KEY: ${LITELLM_MASTER_KEY:?required}
      CHAT_REASONING_EFFORT: ""
      CHAT_TIMEOUT_SECONDS: "60"
      CHAT_CACHE_NAMESPACE: ""
      OPENAI_FALLBACK_MODEL: ""
      EMBEDDING_MODEL: nexa-embed-openai
      EMBEDDING_BASE_URL: http://gateway:4000/v1
      EMBEDDING_API_KEY: ${LITELLM_MASTER_KEY:?required}
      EMBEDDING_DIMENSIONS: "1536"
      EMBEDDING_PROFILE: openai-3-small-gateway-v1
      MONGODB_COLLECTION: lab_chunks_openai_v1
      MONGODB_PARENT_COLLECTION: lab_parents_openai_v1
      RETRIEVAL_MODE: dense
      RERANK_ENABLED: "false"
      EVAL_JUDGE_MODEL: nexa-judge-openai
      EVAL_JUDGE_API_MODE: chat_completions
      EVAL_JUDGE_BASE_URL: http://gateway:4000/v1
      EVAL_JUDGE_API_KEY: ${LITELLM_MASTER_KEY:?required}
      EVAL_EMBEDDING_MODEL: nexa-embed-openai
      EVAL_EMBEDDING_BASE_URL: http://gateway:4000/v1
      EVAL_EMBEDDING_API_KEY: ${LITELLM_MASTER_KEY:?required}
      EVAL_EMBEDDING_DIMENSIONS: "1536"
      EVAL_EMBEDDING_PROFILE: openai-3-small-gateway-v1
      LIVE_EVAL_SAMPLE_RATE: "0"
      RATE_LIMIT_PER_MINUTE: "3"
      # Synthetic course corpus only; set false before sending real/confidential data.
      GUARDRAILS_BASE_URL: http://guardrails:8101
      RAGAS_DO_NOT_TRACK: "true"
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./corpus:/data:ro", "./reports:/reports"]
    depends_on:
      postgres: {condition: service_healthy}
      gateway: {condition: service_healthy}
      guardrails: {condition: service_healthy}
    restart: unless-stopped
  ui:
    labels:
      com.datadoghq.ad.logs: '[{"source":"python","service":"nexaassist-ui"}]'
    image: ${APP_IMAGE:?required}
    command: ["python", "-m", "streamlit", "run", "app/streamlit_app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    environment:
      API_BASE_URL: http://api:8000
      UI_TIMEZONE: Asia/Kolkata
    ports: ["0.0.0.0:8501:8501"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# shortcut: state lasts for one lab session; use RDS and managed telemetry for persistent service.
volumes:
  postgres-data:
