model_list:
  - model_name: nexa-chat-openai
    litellm_params:
      model: os.environ/OPENAI_LITELLM_CHAT_MODEL
      api_key: os.environ/OPENAI_API_KEY
      api_base: https://api.openai.com/v1
      max_tokens: 2000
  - model_name: nexa-judge-openai
    litellm_params:
      model: os.environ/OPENAI_LITELLM_JUDGE_MODEL
      api_key: os.environ/OPENAI_API_KEY
      api_base: https://api.openai.com/v1
      max_tokens: 2000
  - model_name: nexa-embed-openai
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY
      api_base: https://api.openai.com/v1
router_settings:
  num_retries: 1
  timeout: 60
  max_fallbacks: 0
litellm_settings:
  callbacks: ["arize_phoenix"]
  cache: false
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
