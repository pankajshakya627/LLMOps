<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Arial" data-pptx-page-role="content"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#007F86" /></marker></defs><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F5F8FC" /><g id="page-title" data-pptx-bounds="64 28 1152 107" font-weight="bold" text-anchor="start"><text x="64" y="51" font-size="16" fill="#007F86">OPERATING PRACTICE</text><text x="64" y="112" font-size="42" fill="#122C45">Before an enterprise rollout</text></g><g id="responsibility-0" data-pptx-bounds="64 183 360 362"><rect x="64" y="183" width="360" height="362" rx="8" fill="#FFFFFF" stroke="#CFDAE5" stroke-width="1.5" /><rect x="64" y="183" width="360" height="8" rx="0" fill="#007F86" /><text x="86" y="238" font-size="24" fill="#122C45" text-anchor="start" font-weight="bold">Access and data</text><text x="86" y="311" font-size="24" fill="#526A7F" text-anchor="start"><tspan x="86" dy="0">Add access control and</tspan><tspan x="86" dy="37">TLS.</tspan><tspan x="86" dy="37">Use managed secrets and</tspan><tspan x="86" dy="37">scoped DB roles.</tspan><tspan x="86" dy="37">Verify backup / restore</tspan><tspan x="86" dy="37">and retention.</tspan></text></g><g id="responsibility-1" data-pptx-bounds="460 183 360 362"><rect x="460" y="183" width="360" height="362" rx="8" fill="#FFFFFF" stroke="#CFDAE5" stroke-width="1.5" /><rect x="460" y="183" width="360" height="8" rx="0" fill="#007F86" /><text x="482" y="238" font-size="24" fill="#122C45" text-anchor="start" font-weight="bold">Reliability</text><text x="482" y="311" font-size="24" fill="#526A7F" text-anchor="start"><tspan x="482" dy="0">Define actual SLOs and</tspan><tspan x="482" dy="37">escalation.</tspan><tspan x="482" dy="37">Qualify replicas and</tspan><tspan x="482" dy="37">dependency outages.</tspan><tspan x="482" dy="37">Use shared counters /</tspan><tspan x="482" dy="37">cache at scale.</tspan></text></g><g id="responsibility-2" data-pptx-bounds="856 183 360 362"><rect x="856" y="183" width="360" height="362" rx="8" fill="#FFFFFF" stroke="#CFDAE5" stroke-width="1.5" /><rect x="856" y="183" width="360" height="8" rx="0" fill="#007F86" /><text x="878" y="238" font-size="24" fill="#122C45" text-anchor="start" font-weight="bold">Quality release</text><text x="878" y="311" font-size="24" fill="#526A7F" text-anchor="start"><tspan x="878" dy="0">Freeze cases, corpus</tspan><tspan x="878" dy="37">and judge profiles.</tspan><tspan x="878" dy="37">Approve measured</tspan><tspan x="878" dy="37">quality thresholds.</tspan><tspan x="878" dy="37">Keep rollback artifacts</tspan><tspan x="878" dy="37">and namespace.</tspan></text></g><g id="takeaway" data-pptx-bounds="64 575 1152 73"><line x1="64" y1="577" x2="1216" y2="577" stroke="#CFDAE5" stroke-width="2" /><text x="64" y="614" font-size="24" fill="#007F86" text-anchor="start" font-weight="bold">This local Compose stack is a reference deployment to qualify.</text></g><g id="source-caption" data-pptx-bounds="64 652 1152 30"><text x="64" y="673" font-size="16" fill="#526A7F" text-anchor="start">SOURCE  CONSTRAINTS.md:22  ·  Full walkthrough and commands in LAB_GUIDE.md</text></g><text id="deck-footer" data-pptx-role="footer" x="64" y="709" font-size="16" fill="#526A7F">NEXAASSIST  /  SYNTHETIC POLICY REFERENCE  /  27 OCT 2026</text><text id="page-number" data-pptx-role="page-number" x="1216" y="709" text-anchor="end" font-size="16" fill="#526A7F">23 / 24</text></svg>
