<g id="session-label" data-pptx-bounds="64 27 1152 26"><text font-size="16" font-family="Arial" fill="#526375" xml:space="preserve" x="64" y="47">NEXAASSIST  /  SESSION 02  /  DISTILL I</text></g>
<g id="page-title" data-pptx-bounds="64 76 1152 120"><text font-size="40" font-family="Trebuchet MS" fill="#132C42" xml:space="preserve" x="64" y="123">Chunk around clauses, then size</text></g>
<g id="source-code" data-pptx-bounds="64 205 1152 335"><rect x="64" y="205" width="1152" height="335" fill="#132C42" /><text font-size="18" fill="#F5F3EC" xml:space="preserve" x="88" y="237">def chunk_by_clause(elements: list[Element], max_characters: int, overlap: int) -&gt; list[Chunk]:</text><text font-size="18" fill="#F5F3EC" xml:space="preserve" x="88" y="262">    """Hybrid chunking: structure rules first, size rules second.</text><text xml:space="preserve" x="88" y="287" font-size="18" fill="#F5F3EC"><tspan x="88" y="287" /></text><text font-size="18" fill="#F5F3EC" xml:space="preserve" x="88" y="312">    Structure: one chunk per numbered clause ("6.2 Processing fee. ..."). A table or</text><text font-size="18" fill="#F5F3EC" xml:space="preserve" x="88" y="337">    continuation line stays with the clause that introduces it, and a table is never split.</text><text font-size="18" fill="#F5F3EC" xml:space="preserve" x="88" y="362">    Size: only a clause longer than `max_characters` is split. Its tables become their own</text><text font-size="18" fill="#F5F3EC" xml:space="preserve" x="88" y="387">    chunks and its narrative is split at sentence boundaries with `overlap` characters</text><text font-size="18" fill="#F5F3EC" xml:space="preserve" x="88" y="412">    repeated. Text before section 1 is section 0, "Front matter".</text><text font-size="18" fill="#F5F3EC" xml:space="preserve" x="88" y="437">    """</text><text font-size="18" fill="#F5F3EC" xml:space="preserve" x="88" y="462">    section_number, section = 0, "Front matter"</text><text font-size="18" fill="#F5F3EC" xml:space="preserve" x="88" y="487">    clauses: list[_Clause] = [_Clause(section_number, section, None, None)]</text><text font-size="18" fill="#F5F3EC" xml:space="preserve" x="88" y="512">    for element in elements:</text></g>
<g id="interpretation" data-pptx-bounds="64 565 1135 75"><text font-size="26" font-family="Arial" fill="#132C42" xml:space="preserve" x="64" y="592">Inspect how the clause-aware splitter handles oversized sections.</text></g>
