<g id="page-title" data-pptx-bounds="64 76 1152 120"><text x="64" y="123" font-family="Trebuchet MS" font-size="40" fill="#132C42">Code / date and permission filters</text></g>
<g id="source-code" data-pptx-bounds="64 205 1152 340"><rect x="64" y="205" width="1152" height="340" fill="#132C42" /><text font-size="18" font-family="Courier New" fill="#FFFFFF" xml:space="preserve" x="88" y="240">        filters: list[dict[str, object]] = [</text><text font-size="18" font-family="Courier New" fill="#FFFFFF" xml:space="preserve" x="88" y="273">            {"institution": settings.institution},</text><text font-size="18" font-family="Courier New" fill="#FFFFFF" xml:space="preserve" x="88" y="306">            {"effective_date": {"$lte": as_of}},</text><text font-size="18" font-family="Courier New" fill="#FFFFFF" xml:space="preserve" x="88" y="339">            {"effective_to_search": {"$gte": as_of}},</text><text font-size="18" font-family="Courier New" fill="#FFFFFF" xml:space="preserve" x="88" y="372">            {"jurisdiction": request.jurisdiction or settings.jurisdiction},</text><text font-size="18" font-family="Courier New" fill="#FFFFFF" xml:space="preserve" x="88" y="405">            {"confidentiality_level": settings.confidentiality_level},</text><text font-size="18" font-family="Courier New" fill="#FFFFFF" xml:space="preserve" x="88" y="438">        ]</text><text font-size="18" font-family="Courier New" fill="#FFFFFF" xml:space="preserve" x="88" y="471">        if request.product_id is not None:</text><text font-size="18" font-family="Courier New" fill="#FFFFFF" xml:space="preserve" x="88" y="504">            filters.append({"product_id": request.product_id})</text></g>
