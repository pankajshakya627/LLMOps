<g id="page-title" data-pptx-bounds="64 76 1152 120"><text x="64" y="123" font-family="Trebuchet MS" font-size="40" fill="#132C42">Code / the ingestion fingerprint</text></g>
<g id="source-code" data-pptx-bounds="64 210 1152 315"><rect x="64" y="210" width="1152" height="315" fill="#132C42"/><text xml:space="preserve" x="88" y="248" font-family="Courier New" font-size="18" fill="#FFFFFF"><tspan x="88" y="248">def chunk_checksum(text: str, metadata: dict[str, Any]) -&gt; str:</tspan><tspan x="88" y="286">    """Fingerprint text, metadata, embedding model and embedding dimensions.</tspan><tspan x="88" y="324"> </tspan><tspan x="88" y="362">    Enrichment includes both embedding settings, so either change invalidates chunks.</tspan><tspan x="88" y="400">    """</tspan><tspan x="88" y="438">    payload = json.dumps({"text": text, "metadata": metadata}, sort_keys=True, ensure_ascii=False)</tspan><tspan x="88" y="476">    return "sha256:" + hashlib.sha256(payload.encode()).hexdigest()</tspan></text></g>
<g id="interpretation" data-pptx-bounds="64 545 1152 90"><text x="64" y="575" font-size="26" fill="#132C42"><tspan x="64" y="575">Text, metadata, embedding model and dimensions determine</tspan><tspan x="64" y="613">whether to re-embed.</tspan></text></g>
