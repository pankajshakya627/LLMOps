<g id="page-title" data-pptx-bounds="64 76 1152 120"><text fill="#132C42" font-family="Trebuchet MS" font-size="40" xml:space="preserve" x="64" y="123">A gate names the metric that failed</text></g>
<g id="source-code" data-pptx-bounds="64 205 1152 335"><rect x="64" y="205" width="1152" height="335" fill="#132C42" /><text fill="#F5F3EC" font-size="20" xml:space="preserve" x="88" y="237">def gate_failures(report: dict[str, Any], gates: Gates) -&gt; list[dict[str, Any]]:</text><text fill="#F5F3EC" font-size="20" xml:space="preserve" x="88" y="262">    """Offline quality gate: aggregate means plus the cases that fell short."""</text><text fill="#F5F3EC" font-size="20" xml:space="preserve" x="88" y="287">    records = report["records"]</text><text fill="#F5F3EC" font-size="20" xml:space="preserve" x="88" y="312">    failures: list[dict[str, Any]] = []</text><text xml:space="preserve" x="88" y="337" font-size="20" fill="#F5F3EC"><tspan x="88" y="337" /></text><text fill="#F5F3EC" font-size="20" xml:space="preserve" x="88" y="362">    def check(metric: str, value: float, minimum: float) -&gt; None:</text><text fill="#F5F3EC" font-size="20" xml:space="preserve" x="88" y="387">        if value &lt; minimum:</text><text fill="#F5F3EC" font-size="20" xml:space="preserve" x="88" y="412">            failures.append({"metric": metric, "value": round(value, 4), "minimum": minimum})</text><text xml:space="preserve" x="88" y="437" font-size="20" fill="#F5F3EC"><tspan x="88" y="437" /></text><text fill="#F5F3EC" font-size="20" xml:space="preserve" x="88" y="462">    for name, value in report["ragas"]["means"].items():</text><text fill="#F5F3EC" font-size="20" xml:space="preserve" x="88" y="487">        check(name, value, getattr(gates, f"{name}_min"))</text><text fill="#F5F3EC" font-size="20" xml:space="preserve" x="88" y="512">    for key in ("correctness", "groundedness"):</text></g>
<g id="interpretation" data-pptx-bounds="64 565 1135 75"><text fill="#132C42" font-family="Arial" font-size="26" xml:space="preserve" x="64" y="592">Per-metric means and failed cases make the decision actionable.</text></g>
