<g id="page-title" data-pptx-bounds="64 76 1152 120"><text xml:space="preserve" x="64" y="123" font-family="Trebuchet MS" font-size="40" fill="#132C42"><tspan x="64" y="123">A gate names the metric that failed</tspan></text></g>
<g id="source-code" data-pptx-bounds="64 205 1152 335"><rect x="64" y="205" width="1152" height="335" fill="#132C42" /><text xml:space="preserve" x="88" y="237" font-size="20" fill="#F5F3EC"><tspan x="88" y="237">def gate_failures(report: dict[str, Any], gates: Gates) -&gt; list[dict[str, Any]]:</tspan></text><text xml:space="preserve" x="88" y="262" font-size="20" fill="#F5F3EC"><tspan x="88" y="262">    """Offline quality gate: aggregate means plus the cases that fell short."""</tspan></text><text xml:space="preserve" x="88" y="287" font-size="20" fill="#F5F3EC"><tspan x="88" y="287">    records = report["records"]</tspan></text><text xml:space="preserve" x="88" y="312" font-size="20" fill="#F5F3EC"><tspan x="88" y="312">    failures: list[dict[str, Any]] = []</tspan></text><text xml:space="preserve" x="88" y="337" font-size="20" fill="#F5F3EC"><tspan x="88" y="337" /></text><text xml:space="preserve" x="88" y="362" font-size="20" fill="#F5F3EC"><tspan x="88" y="362">    def check(metric: str, value: float, minimum: float) -&gt; None:</tspan></text><text xml:space="preserve" x="88" y="387" font-size="20" fill="#F5F3EC"><tspan x="88" y="387">        if value &lt; minimum:</tspan></text><text xml:space="preserve" x="88" y="412" font-size="20" fill="#F5F3EC"><tspan x="88" y="412">            failures.append({"metric": metric, "value": round(value, 4), "minimum": minimum})</tspan></text><text xml:space="preserve" x="88" y="437" font-size="20" fill="#F5F3EC"><tspan x="88" y="437" /></text><text xml:space="preserve" x="88" y="462" font-size="20" fill="#F5F3EC"><tspan x="88" y="462">    for name, value in report["ragas"]["means"].items():</tspan></text><text xml:space="preserve" x="88" y="487" font-size="20" fill="#F5F3EC"><tspan x="88" y="487">        check(name, value, getattr(gates, f"{name}_min"))</tspan></text><text xml:space="preserve" x="88" y="512" font-size="20" fill="#F5F3EC"><tspan x="88" y="512">    for key in ("correctness", "groundedness"):</tspan></text></g>
